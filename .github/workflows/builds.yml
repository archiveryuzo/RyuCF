name: Build plugin

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: unzip -o RyuCF.zip

      - name: Build jar
        run: mvn -B package
        working-directory: RyuCF

      - uses: actions/upload-artifact@v4
        with:
          name: RyuCF-jar
          path: RyuCF/target/RyuCF.jar
